name: Integrate Astra API Hub

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Integrate API Hub into main navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate API Hub into the single main UI
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('app/src/main/java/com/astra/ai/AstraMainActivity.kt')
          text = main.read_text()

          old_nav = '''NavigationBarItem(page == 3, { page = 3 }, icon = { Text("▣") }, label = { Text("Chats") })'''
          new_nav = '''NavigationBarItem(page == 3, { page = 3 }, icon = { Text("⌘") }, label = { Text("APIs") })'''
          if old_nav not in text:
              raise SystemExit('Expected navigation item not found')
          text = text.replace(old_nav, new_nav, 1)

          old_page = '''if (page == 3) { item { Text("CHAT HISTORY", color = Color.White, style = MaterialTheme.typography.titleMedium); Button({ runtime.newChat(); info = "New chat created." }, Modifier.fillMaxWidth()) { Text("New chat") } }; items(chatStore.listChats(), key = { it.id }) { c -> Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF11131B))) { Row(Modifier.fillMaxWidth().padding(10.dp), verticalAlignment = Alignment.CenterVertically) { Text(c.title, color = Color.White, Modifier.weight(1f)); TextButton({ runtime.selectChat(c.id) }) { Text("Open") } } } } }'''
          new_page = '''if (page == 3) {
                item { AstraApiPanel() }
                item {
                    Text("CHAT HISTORY", color = Color.White, style = MaterialTheme.typography.titleMedium)
                    Button({ runtime.newChat(); info = "New chat created." }, Modifier.fillMaxWidth()) { Text("New chat") }
                }
                items(chatStore.listChats(), key = { it.id }) { c ->
                    Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF11131B))) {
                        Row(Modifier.fillMaxWidth().padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                            Text(c.title, color = Color.White, Modifier.weight(1f))
                            TextButton({ runtime.selectChat(c.id) }) { Text("Open") }
                        }
                    }
                }
            }'''
          if old_page not in text:
              raise SystemExit('Expected page 3 block not found')
          text = text.replace(old_page, new_page, 1)
          main.write_text(text)

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          pattern = r'<activity android:name="\\.AstraApiActivity" android:exported="true" android:label="Astra API Hub">.*?</activity>'
          replacement = '<activity android:name=".AstraApiActivity" android:exported="false" android:label="Astra API Hub" />'
          m2, count = re.subn(pattern, replacement, m, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('API activity launcher entry not found')
          manifest.write_text(m2)

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/astra/ai/AstraMainActivity.kt app/src/main/AndroidManifest.xml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate API Hub into main navigation"
          git push
