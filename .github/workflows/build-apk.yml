name: Build Astra Unified APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply Astra upgrades
        shell: bash
        run: |
          python tools/upgrade_audio_sync.py
          python tools/fix_audio_compile.py
          python tools/upgrade_intelligence_ui.py
          python tools/fix_intelligence_compile.py
          sed -E -i 's/[; ]padding[ ]*=[ ]*[0-9]+//g' app/src/main/java/com/astra/ai/AstraProviderActivity.kt 2>/dev/null || true
          python tools/upgrade_lan_web_ui.py
          python tools/upgrade_siri_orb.py
          python tools/fix_siri_compile.py
          python tools/upgrade_advanced_settings.py
          python tools/fix_advanced_compile.py
          python tools/fix_settings_persistence.py
          python tools/fix_persistent_settings_and_connections.py
          python tools/harden_ai_routing_and_settings.py
          python tools/add_connection_commands.py
          python tools/fix_ai_model_ui_and_openai_lag.py
          python tools/add_automation_brain.py
          python tools/fix_automation_compile.py
          python tools/upgrade_agent_brain_and_device_control.py
          python tools/fix_latest_compile.py
          python tools/upgrade_siri_ui.py
          python tools/upgrade_multi_agent_smoothness.py
          python tools/fix_multi_agent_compile.py
          python tools/final_ui_performance_cleanup.py
          python tools/fix_openai_ui_and_compile.py
          python tools/upgrade_screen_agent_translation.py
          python tools/fix_screen_agent_compile.py
          python tools/final_realtime_upgrade.py
          python tools/final_realtime_hardening.py
          python tools/fix_realtime_compile.py
      - name: Verify critical Astra features
        shell: bash
        run: |
          set -e
          test -f app/src/main/java/com/astra/ai/LiveAgentSession.kt
          test -f app/src/main/java/com/astra/ai/AstraCredentialVault.kt
          test -f app/src/main/java/com/astra/ai/AstraConnectionManager.kt
          test -f app/src/main/java/com/astra/ai/AstraConnectionTools.kt
          test -f app/src/main/java/com/astra/ai/AstraOAuthManager.kt
          test -f app/src/main/java/com/astra/ai/AstraAIConfiguration.kt
          test -f app/src/main/java/com/astra/ai/AstraAIProviderRouter.kt
          test -f app/src/main/java/com/astra/ai/AstraConnectedAppsActivity.kt
          test -f app/src/main/java/com/astra/ai/AstraAdvancedSettingsActivity.kt
          test -f app/src/main/java/com/astra/ai/AstraAutomationEngine.kt
          test -f app/src/main/java/com/astra/ai/AstraAutomationActivity.kt
          test -f app/src/main/java/com/astra/ai/AstraAutomationReceiver.kt
          test -f app/src/main/java/com/astra/ai/AstraCommandPlanner.kt
          test -f app/src/main/java/com/astra/ai/AstraAgenticExecutor.kt
          test -f app/src/main/java/com/astra/ai/AstraMultiAgentRuntime.kt
          test -f app/src/main/java/com/astra/ai/AstraSiriVoiceInteractionSession.kt
          test -f app/src/main/java/com/astra/ai/AstraPromptTranslationService.kt
          test -f app/src/main/java/com/astra/ai/AstraRealtimeCore.kt
          test -f tools/final_ui_performance_cleanup.py
          test -f tools/fix_openai_ui_and_compile.py
          test -f tools/upgrade_screen_agent_translation.py
          test -f tools/fix_screen_agent_compile.py
          test -f tools/final_realtime_upgrade.py
          test -f tools/final_realtime_hardening.py
          test -f tools/fix_realtime_compile.py
          grep -q 'AstraConnectedAppsActivity' app/src/main/AndroidManifest.xml
          grep -q 'AstraAutomationActivity' app/src/main/AndroidManifest.xml
          grep -q 'AstraAutomationReceiver' app/src/main/AndroidManifest.xml
          grep -q 'AstraVoiceInteractionSessionService' app/src/main/res/xml/voice_interaction_service.xml
          grep -q 'AstraSiriVoiceInteractionSession' app/src/main/java/com/astra/ai/AstraVoiceInteractionSessionService.kt
          grep -q 'AstraAgenticExecutor' app/src/main/java/com/astra/ai/AstraAgentRuntime.kt
          grep -q 'AstraMultiAgentRuntime' app/src/main/java/com/astra/ai/AstraAgentRuntime.kt
          grep -q 'AstraCommandPlanner' app/src/main/java/com/astra/ai/AstraAgentRuntime.kt
          grep -q 'AstraAutomationEngine' app/src/main/java/com/astra/ai/AstraAgentRuntime.kt
          grep -q 'AstraAutomationActivity' app/src/main/java/com/astra/ai/AstraAgentRuntime.kt
          grep -q 'AstraPromptTranslationService' app/src/main/java/com/astra/ai/AstraAgentRuntime.kt
          grep -q 'shouldUseMultiAgent' app/src/main/java/com/astra/ai/AstraAgentRuntime.kt
          grep -q 'readInteractiveScreen' app/src/main/java/com/astra/ai/AstraAccessibilityService.kt
          grep -q 'clickTextNormalized' app/src/main/java/com/astra/ai/AstraAccessibilityService.kt
          grep -q 'scrollSemantic' app/src/main/java/com/astra/ai/AstraAccessibilityService.kt
          grep -q 'longPress' app/src/main/java/com/astra/ai/AstraAccessibilityService.kt
          grep -q 'doubleTap' app/src/main/java/com/astra/ai/AstraAccessibilityService.kt
          grep -q 'waitForUiChange' app/src/main/java/com/astra/ai/AstraAgenticExecutor.kt
          grep -q 'setTimer' app/src/main/java/com/astra/ai/AstraTooling.kt
          grep -q 'AlarmClock.ACTION_SET_TIMER' app/src/main/java/com/astra/ai/AstraTooling.kt
          grep -q 'timer' app/src/main/java/com/astra/ai/AstraAgentRuntime.kt
          grep -q 'AstraAdvancedSettingsActivity' app/src/main/java/com/astra/ai/AstraMainActivity.kt
          grep -q 'AstraVoiceActivity' app/src/main/java/com/astra/ai/AstraMainActivity.kt
          ! grep -q 'endpoint.contains(":12434")' app/src/main/java/com/astra/ai/AstraMainActivity.kt
          ! grep -q 'u.port == 12434' app/src/main/java/com/astra/ai/LocalAiGateway.kt
          grep -q 'local.endpoint()' app/src/main/java/com/astra/ai/AstraMainActivity.kt
          grep -q 'local.configure(endpoint, model)' app/src/main/java/com/astra/ai/AstraMainActivity.kt
          ! grep -q 'LaunchedEffect(page) { if (page == 1) discoverAllModels() }' app/src/main/java/com/astra/ai/AstraMainActivity.kt
          ! grep -q 'Fetch OpenAI Models' app/src/main/java/com/astra/ai/AstraMainActivity.kt
          ! grep -q 'openAi.discoverModels()' app/src/main/java/com/astra/ai/AstraMainActivity.kt
          ! grep -q 'openAiModels' app/src/main/java/com/astra/ai/AstraMainActivity.kt
          grep -q 'hasOpenAiApiKey' app/src/main/java/com/astra/ai/AstraViewModel.kt
      - name: Build unified debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-build-diagnostics
          path: build.log
          if-no-files-found: warn
      - name: Persist failed build log through GitHub API
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          encoded=$(base64 -w0 build.log)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/debug/latest-build.log" --jq '.sha' 2>/dev/null || true)
          if [ -n "$sha" ]; then gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/debug/latest-build.log" -f message='debug: update failed build log [skip ci]' -f content="$encoded" -f sha="$sha" -f branch="$GITHUB_REF_NAME" >/dev/null; else gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/debug/latest-build.log" -f message='debug: persist failed build log [skip ci]' -f content="$encoded" -f branch="$GITHUB_REF_NAME" >/dev/null; fi
      - name: Upload unified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astra-unified-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
