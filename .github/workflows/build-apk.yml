name: Build Astra APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build local and cloud debug APKs
        run: gradle assembleLocalDebug assembleCloudDebug --no-daemon
      - name: Upload local-only APK
        uses: actions/upload-artifact@v4
        with:
          name: astra-local-debug-apk
          path: app/build/outputs/apk/local/debug/app-local-debug.apk
          if-no-files-found: error
      - name: Upload cloud-enabled APK
        uses: actions/upload-artifact@v4
        with:
          name: astra-cloud-debug-apk
          path: app/build/outputs/apk/cloud/debug/app-cloud-debug.apk
          if-no-files-found: error
