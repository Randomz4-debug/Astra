name: Build Astra Unified APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply Astra upgrades
        shell: bash
        run: |
          python tools/upgrade_audio_sync.py
          python tools/fix_audio_compile.py
          python tools/upgrade_intelligence_ui.py
          python tools/fix_intelligence_compile.py
          python tools/upgrade_lan_web_ui.py
          python tools/upgrade_siri_orb.py
          python tools/fix_siri_compile.py
          python tools/add_credentials_vault.py
      - name: Build unified debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-build-diagnostics
          path: build.log
          if-no-files-found: warn
      - name: Persist failed build log for debugging
        if: failure()
        shell: bash
        run: |
          mkdir -p debug
          cp build.log debug/latest-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/latest-build.log
          git diff --cached --quiet || git commit -m "debug: persist failed build log [skip ci]"
          git push
      - name: Upload unified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astra-unified-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
