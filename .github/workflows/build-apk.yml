name: Build Astra Unified APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply Astra upgrades
        shell: bash
        run: |
          python tools/upgrade_audio_sync.py
          python tools/fix_audio_compile.py
          python tools/upgrade_intelligence_ui.py
          python tools/fix_intelligence_compile.py
      - name: Build unified debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-build-diagnostics
          path: build.log
          if-no-files-found: warn
      - name: Upload unified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astra-unified-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
