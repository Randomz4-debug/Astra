name: Integrate API Hub v2

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Integrate API Hub into main navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/astra/ai/AstraMainActivity.kt')
          s = p.read_text()
          s = s.replace('NavigationBarItem(page == 3, { page = 3 }, icon = { Text("▣") }, label = { Text("Chats") })', 'NavigationBarItem(page == 3, { page = 3 }, icon = { Text("⌘") }, label = { Text("APIs") })')
          old = 'if (page == 3) { item { Text("CHAT HISTORY", color = Color.White, style = MaterialTheme.typography.titleMedium); Button({ runtime.newChat(); info = "New chat created." }, Modifier.fillMaxWidth()) { Text("New chat") } }; items(chatStore.listChats(), key = { it.id }) { c -> Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF11131B))) { Row(Modifier.fillMaxWidth().padding(10.dp), verticalAlignment = Alignment.CenterVertically) { Text(c.title, color = Color.White, Modifier.weight(1f)); TextButton({ runtime.selectChat(c.id) }) { Text("Open") } } } } }'
          new = '''if (page == 3) {
              item { AstraApiPanel() }
              item { Text("CHAT HISTORY", color = Color.White, style = MaterialTheme.typography.titleMedium); Button({ runtime.newChat(); info = "New chat created." }, Modifier.fillMaxWidth()) { Text("New chat") } }
              items(chatStore.listChats(), key = { it.id }) { c -> Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF11131B))) { Row(Modifier.fillMaxWidth().padding(10.dp), verticalAlignment = Alignment.CenterVertically) { Text(c.title, color = Color.White, Modifier.weight(1f)); TextButton({ runtime.selectChat(c.id) }) { Text("Open") } } } }
          }'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          m = Path('app/src/main/AndroidManifest.xml')
          s = m.read_text()
          s = re.sub(r'<activity android:name="\.AstraApiActivity" android:exported="true" android:label="Astra API Hub">.*?</activity>', '<activity android:name=".AstraApiActivity" android:exported="false" android:label="Astra API Hub" />', s, count=1, flags=re.S)
          m.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/astra/ai/AstraMainActivity.kt app/src/main/AndroidManifest.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate API Hub into main navigation'
          git push
