<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astra</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070a10;color:#edf4ff;font:15px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:14px}.top{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#15221b;border:1px solid #7cffb2;color:#7cffb2;font-weight:900;font-size:24px}.card{background:#101722;border:1px solid #26354a;border-radius:18px;padding:14px;margin:10px 0}.chat{min-height:48vh;max-height:58vh;overflow:auto}.msg{padding:11px 13px;border-radius:14px;margin:8px 0;white-space:pre-wrap}.u{background:#18314b;margin-left:12%}.a{background:#17201d;margin-right:12%}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}textarea,input,select,button{font:inherit;border-radius:11px;border:1px solid #30445d;background:#0b111a;color:#fff;padding:10px}textarea{width:100%;min-height:72px}button{cursor:pointer;background:#315fd4;border:0;font-weight:700}button.secondary{background:#253247}.grow{flex:1}.drawer{display:none}.drawer.open{display:block}.meter{height:9px;background:#202a37;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#7cffb2;transition:width .08s}.pill{padding:5px 9px;border-radius:99px;background:#18212d;color:#9fb1c9;font-size:12px}</style></head>
<body><main>
<div class="card top"><div class="logo">A</div><div class="grow"><h2 style="margin:0">ASTRA</h2><small id="status">Ready</small></div><button class="secondary" onclick="toggleDrawer()">☰ Settings</button></div>
<div id="drawer" class="card drawer"><b>Assistant settings</b><p class="pill">Voice</p><select id="voice"><option value="auto">Automatic voice</option><option value="en-US">English</option><option value="hi-IN">Hindi</option><option value="es-ES">Spanish</option><option value="fr-FR">French</option><option value="de-DE">German</option><option value="ja-JP">Japanese</option><option value="ko-KR">Korean</option><option value="zh-CN">Chinese</option></select><p class="pill">AI / model</p><select id="model"><option value="">Auto-select best available model</option></select><button class="secondary" onclick="discover()">Discover AIs & models</button><p class="pill">Custom sub-agent instruction</p><input id="instruction" style="width:100%" placeholder="Example: act as a researcher and return sources"></div>
<div id="chat" class="card chat"></div>
<div class="card"><div class="meter"><i id="meter"></i></div><small>Voice activity / background noise level</small></div>
<div class="card"><textarea id="q" placeholder="Talk to Astra, type a command, or give a task..."></textarea><div class="row"><button onclick="send()">Send</button><button class="secondary" onclick="listen()">🎙 Listen</button><button class="secondary" onclick="stop()">■ Stop</button><button class="secondary" onclick="screenRead()">▣ Read Screen</button><button class="secondary" onclick="parallel()">⚡ Parallel Tasks</button></div></div>
<div class="card"><div class="row"><span class="pill">LAN API: /api/status</span><span class="pill">Models: /api/models</span><span class="pill">Providers: /api/providers</span><span class="pill">Chat: /api/chat</span></div></div>
<script>const chat=document.getElementById('chat'),q=document.getElementById('q'),status=document.getElementById('status'),meter=document.getElementById('meter'),model=document.getElementById('model');function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function toggleDrawer(){document.getElementById('drawer').classList.toggle('open')}async function discover(){status.textContent='Discovering…';try{let r=await fetch('/api/models');let a=await r.json();model.innerHTML='<option value="">Auto-select best available model</option>'+a.filter(x=>x.id).map(x=>'<option value="'+x.providerId+'">'+x.providerName+' / '+x.id+'</option>').join('');status.textContent=a.length+' model(s) discovered'}catch(e){status.textContent='Discovery failed'}}async function send(){let t=q.value.trim();if(!t)return;add(t,'u');q.value='';status.textContent='Thinking…';let endpoint=model.value?'/api/provider/chat':'/api/chat';let body=model.value?{providerId:model.value,prompt:t}:{prompt:t};try{let r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let x=await r.json();add(x.response||x.error||JSON.stringify(x),'a');status.textContent='Ready'}catch(e){add('Connection failed: '+e.message,'a');status.textContent='Offline'}}async function parallel(){let lines=q.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length){status.textContent='Put one task per line in the message box';return}status.textContent='Running sub-AIs in parallel…';try{let r=await fetch('/api/parallel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tasks:lines.map(x=>({task:x,instruction:document.getElementById('instruction').value}))})});add(JSON.stringify(await r.json(),null,2),'a');status.textContent='Ready'}catch(e){status.textContent='Parallel run failed'}}function listen(){if(window.Astra&&Astra.listen){status.textContent='Listening…';Astra.listen()}else status.textContent='Voice bridge unavailable'}function stop(){if(window.Astra&&Astra.stop)Astra.stop();status.textContent='Stopped'}function screenRead(){if(window.Astra&&Astra.readScreen)Astra.readScreen();else status.textContent='Screen bridge unavailable'}function onAstraResponse(t){add(t,'a');status.textContent='Ready'}function setNoise(v){meter.style.width=Math.max(0,Math.min(100,(v+60)/60*100))}discover();</script></main></body></html>
